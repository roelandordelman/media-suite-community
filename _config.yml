title: Media Suite Community
description: A hub for researchers, developers, and enthusiasts around the CLARIAH Media Suite.
baseurl: "/media-suite-community"
url: "https://roelandordelman.github.io" # update with your GitHub username

# Build settings
markdown: kramdown
permalink: /news/:year/:month/:day/:title/
future: true # publish future-dated events

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  events:
    output: true
    permalink: /events/:name/
  sane-collections:
    output: true
    permalink: /sane/collections/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "sane-collections"
    values:
      layout: "sane-collection"

# Ask page — set to your API endpoint base URL (e.g. https://api.example.com)
ask_api_url: "http://localhost:8000"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
